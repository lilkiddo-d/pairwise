<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18211f"/>
      <stop offset="1" stop-color="#0a0e0d"/>
    </linearGradient>
    <clipPath id="left"><circle cx="385" cy="500" r="235"/></clipPath>
  </defs>
  <circle cx="500" cy="500" r="500" fill="url(#bg)"/>
  <!-- overlap lens: the spread -->
