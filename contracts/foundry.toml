[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read", path = "../config" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../app/public/deployments" },
  { access = "read", path = "./out" },
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
local = "http://127.0.0.1:8545"

[etherscan]
robinhood = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }

[fmt]
line_length = 120

[lint]
lint_on_build = false
